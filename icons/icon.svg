      <text x="26" y="134" font-family="Helvetica, Arial, sans-serif" font-size="54" fill="#d3202a">♥</text>
      <text x="88" y="214" font-family="Helvetica, Arial, sans-serif" font-size="100" fill="#d3202a">♥</text>
    </g>
    <g transform="translate(256 400)">
