      <text x="22" y="74" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="70" fill="#15171c">A</text>
      <text x="26" y="134" font-family="Helvetica, Arial, sans-serif" font-size="54" fill="#15171c">♠</text>
      <text x="92" y="214" font-family="Helvetica, Arial, sans-serif" font-size="100" fill="#15171c">♠</text>
